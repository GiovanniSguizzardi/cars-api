# ---------------------------------------------------------------------------
# Profile prd (producao)
#
# Toda a conexao vem de variaveis de ambiente - nada sensivel fica no jar.
# O banco de dados e as tabelas NAO sao criados pela aplicacao:
#   - a URL nao usa createDatabaseIfNotExist
#   - ddl-auto=none  -> o Hibernate nao gera/altera nenhuma tabela
#   - spring.sql.init.mode=never -> nenhum schema.sql/data.sql e executado
# O schema deve ser criado previamente com o script db/init-prd.sql
# ---------------------------------------------------------------------------
spring.application.name=cars-api
server.port=8080
api.version=v1

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Swagger / OpenAPI - mantido acessivel para avaliacao
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/
springdoc.api-docs.path=/v3/api-docs

logging.level.root=INFO
