spring.application.name=cars-api
server.port=8080
api.version=v1

# ---------------------------------------------------------------------------
# Profile padrao (default) - ambiente de desenvolvimento local
# O banco e as tabelas SAO criados automaticamente aqui.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/api?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root_pwd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/
springdoc.api-docs.path=/v3/api-docs
